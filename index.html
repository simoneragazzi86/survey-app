<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Survey Report</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Survey">
<meta name="theme-color" content="#1a3a5c">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a3a5c;--navy2:#2d5a8e;--gold:#c8a84b;--bg:#f0f4f8;
  --card:#fff;--text:#1a1a2e;--muted:#6b7280;--border:#d1d5db;
  --green:#059669;--red:#dc2626;--r:10px;--sh:0 2px 8px rgba(0,0,0,.08)
}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:76px}
input,textarea,select{font-size:16px!important;font-family:inherit}
button{font-family:inherit;cursor:pointer}

/* HEADER */
.hdr{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hdr-row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr h1{font-size:1rem;font-weight:700;letter-spacing:.02em}
.vessel-name{font-size:.78rem;color:var(--gold);margin-top:2px;min-height:1em}

/* NAV TABS */
.nav{background:var(--navy);padding:0 10px 8px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex;gap:5px}
.nav::-webkit-scrollbar{display:none}
.nav-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:20px;font-size:.75rem;font-weight:500;color:rgba(255,255,255,.65);border:1px solid transparent;background:transparent;white-space:nowrap;transition:all .2s}
.nav-btn.active{background:var(--gold);color:var(--navy);font-weight:700}
.nav-btn.disabled-sec{opacity:.45}
.nav-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}

/* MAIN */
.main{padding:12px;max-width:860px;margin:0 auto}

/* CARD */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card-hdr{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-hdr h2{font-size:.9rem;font-weight:700;letter-spacing:.03em;line-height:1.2}
.card-hdr .en{font-size:.72rem;color:rgba(255,255,255,.65);font-weight:400}
.card-body{padding:10px 14px}

/* TOGGLE */
.tog{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 10px;border-radius:20px;font-size:.73rem;font-weight:600;flex-shrink:0}
.tog.off{background:var(--red);border-color:var(--red)}

/* FIELD ROWS */
.frow{display:grid;grid-template-columns:45% 1fr;gap:6px;padding:7px 0;border-bottom:1px solid var(--border);align-items:center}
.frow:last-child{border-bottom:none}
.flabel{font-size:.78rem;color:var(--muted);font-weight:500;line-height:1.3;padding-right:4px}
.fval{display:flex;gap:5px;align-items:center}
.fi{flex:1;border:1px solid var(--border);border-radius:6px;padding:8px 9px;font-size:.88rem;background:#fff;color:var(--text);-webkit-appearance:none;width:100%}
.fi:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(45,90,142,.15)}
.sn-btn{flex-shrink:0;background:var(--navy);color:#fff;border:none;border-radius:5px;padding:7px 7px;font-size:.68rem;font-weight:700;line-height:1}
.del-row{background:#fee2e2;color:var(--red);border:none;border-radius:5px;padding:7px 7px;font-size:1rem;line-height:1;flex-shrink:0}

/* ROW ACTIONS */
.row-actions{display:flex;gap:8px;padding:8px 0 2px;justify-content:flex-start}
.btn-add{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:7px 13px;font-size:.8rem;font-weight:600}
.btn-add-custom{background:#e0e7ff;color:#3730a3;border:none;border-radius:7px;padding:7px 13px;font-size:.8rem;font-weight:600}

/* TESTS TABLE */
.sec-title{font-size:.78rem;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.tests-tbl{width:100%;border-collapse:collapse;margin-bottom:4px}
.tests-tbl th{background:#f1f5f9;font-size:.75rem;font-weight:600;padding:5px 7px;text-align:left;border:1px solid var(--border)}
.tests-tbl td{padding:3px 4px;border:1px solid var(--border)}
.tests-tbl .tfi{width:100%;border:none;padding:6px 5px;font-size:.85rem;background:transparent}
.del-test{background:#fee2e2;color:var(--red);border:none;border-radius:4px;padding:4px 6px;font-size:.8rem}
.btn-add-test{background:#e0e7ff;color:#3730a3;border:none;border-radius:7px;padding:5px 10px;font-size:.75rem;font-weight:600;margin-top:4px}

/* PHOTOS */
.photos-wrap{margin-top:12px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photo-item{position:relative}
.photo-item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.photo-del{position:absolute;top:3px;right:3px;background:rgba(220,38,38,.85);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:14px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.photo-cap{width:100%;border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:.73rem;margin-top:4px;color:var(--text)}
.photo-add{width:100%;aspect-ratio:4/3;border:2px dashed var(--border);border-radius:6px;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:.73rem;gap:4px}
.photo-add svg{opacity:.4;width:26px;height:26px}
.photo-input{display:none}

/* NOTES / OUTCOME */
.no-wrap{margin-top:12px;display:grid;gap:9px}
.no-wrap label{font-size:.78rem;font-weight:700;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.no-wrap textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:.88rem;resize:vertical;min-height:58px;color:var(--text);background:#fff}
.no-wrap textarea:focus{outline:none;border-color:var(--navy2)}
.outcome-ta{background:#fefce8!important;border-color:#d4af37!important;font-weight:600}

/* DOCUMENTS TABLE */
.docs-tbl{width:100%;border-collapse:collapse}
.docs-tbl th{background:#f1f5f9;font-size:.73rem;font-weight:700;padding:5px 6px;border:1px solid var(--border);text-align:left}
.docs-tbl td{padding:3px 4px;border:1px solid var(--border)}
.docs-tbl .dfi{width:100%;border:none;padding:5px 4px;font-size:.82rem;background:transparent}
.del-doc{background:#fee2e2;color:var(--red);border:none;border-radius:4px;padding:4px 6px;font-size:.8rem}
.btn-add-doc{background:#e0e7ff;color:#3730a3;border:none;border-radius:7px;padding:5px 10px;font-size:.75rem;font-weight:600;margin-top:4px}

/* COVER FORM */
.cover-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cover-field{display:flex;flex-direction:column;gap:4px}
.cover-field label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cover-field input,.cover-field textarea{border:1px solid var(--border);border-radius:7px;padding:9px 10px;font-size:.9rem;background:#fff;color:var(--text);-webkit-appearance:none}
.cover-field input:focus,.cover-field textarea:focus{outline:none;border-color:var(--navy2)}
.cover-field.full{grid-column:1/-1}

/* SEA TRIAL TABLE */
.sea-grid{display:grid;gap:8px}
.sea-run-card{border:1px solid var(--border);border-radius:7px;overflow:hidden}
.sea-run-hdr{background:#f1f5f9;padding:6px 10px;font-size:.78rem;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.sea-run-body{padding:6px}
.sea-tbl{width:100%;border-collapse:collapse;font-size:.78rem}
.sea-tbl td{padding:4px 5px;border:1px solid var(--border)}
.sea-tbl td:first-child{font-weight:600;background:#f8fafc;width:55%}
.sea-tbl input{width:100%;border:none;padding:3px;font-size:.8rem;background:transparent;text-align:center}

/* BOTTOM BAR */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:200}
.btn-primary{flex:1;background:var(--navy);color:#fff;border:none;border-radius:9px;padding:12px;font-size:.9rem;font-weight:700}
.btn-secondary{background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:9px;padding:12px 14px;font-size:.82rem;font-weight:700}
.btn-danger{background:var(--red);color:#fff;border:none;border-radius:9px;padding:12px 14px;font-size:.82rem;font-weight:700}

/* TOAST */
.toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);background:#1a3a5c;color:#fff;padding:9px 18px;border-radius:20px;font-size:.85rem;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast.show{opacity:1}

/* SAVE STATUS */
.save-status{font-size:.72rem;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:4px;flex-shrink:0}
.save-dot{width:7px;height:7px;border-radius:50%;background:#4ade80}
.save-dot.saving{background:var(--gold);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* DISABLED SECTION OVERLAY */
.sec-disabled .card-body,.sec-disabled .frow,.sec-disabled .tests-tbl,.sec-disabled .photos-wrap,.sec-disabled .no-wrap{opacity:.35;pointer-events:none}

/* RESPONSIVE */
@media(max-width:520px){
  .cover-grid{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:repeat(2,1fr)}
  .frow{grid-template-columns:1fr}
  .fval{flex-wrap:nowrap}
}
</style>
</head>

<div class="toast" id="toast"></div>

function defaultSeaRuns() {
  const PARAMS = [

    "Fuel consump. rate (lt/h)","Gearbox oil pressure (kPa)","Gearbox oil temp. (°C)",

  ];
  const runs = Array.from({length:9}, (_,i) => ({

function getSection(id) { return state.sections.find(s=>s.id===id); }
function getDef(id) { return SECTIONS.find(s=>s.id===id); }

// ─── INDEXEDDB ───────────────────────────────────────────────────────────────
let db = null;
async function openDB() {
  if (db) return db;
  return new Promise((res,rej) => {
    const req = indexedDB.open('SurveyApp', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('data');
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e.target.error);
  });
}
async function saveState() {
  setStatus('saving');
  try {
    const d = await openDB();
    await new Promise((res,rej) => {
      const tx = d.transaction('data','readwrite');
      tx.objectStore('data').put(JSON.stringify(state), 'current');
      tx.oncomplete = () => { setStatus('saved'); res(); };
      tx.onerror = rej;
    });
  } catch(e) { console.error(e); setStatus('saved'); }
}
async function loadState() {
  try {
    const d = await openDB();
    return new Promise((res,rej) => {
      const tx = d.transaction('data','readonly');
      const req = tx.objectStore('data').get('current');
      req.onsuccess = e => res(e.target.result ? JSON.parse(e.target.result) : null);
      req.onerror = rej;
    });
  } catch(e) { return null; }
}
async function clearState() {
  const d = await openDB();
  return new Promise((res,rej) => {
    const tx = d.transaction('data','readwrite');
    tx.objectStore('data').delete('current');
    tx.oncomplete = res; tx.onerror = rej;
  });
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 800);
}

function setStatus(s) {
  const dot = document.getElementById('save-dot');
  const lbl = document.getElementById('save-label');
  if (!dot) return;
  if (s==='saving') { dot.className='save-dot saving'; lbl.textContent='Salvataggio…'; }
  else { dot.className='save-dot'; lbl.textContent='Salvato'; }
}

function buildNav() {
  const nav = document.getElementById('nav-tabs');
  nav.innerHTML = SECTIONS.map(s => {
    const sec = getSection(s.id);
    const isActive = s.id === currentTab;
    const isDisabled = !sec.enabled;
    return `<button class="nav-btn${isActive?' active':''}${isDisabled?' disabled-sec':''}"
      onclick="switchTab('${s.id}')">${s.navLabel||s.title.split(' ')[0]}</button>`;
  }).join('');
  // scroll active tab into view
  setTimeout(() => {
    const active = nav.querySelector('.active');
    if (active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }, 50);
}

function switchTab(id) {
  currentTab = id;
  buildNav();
  renderSection();
}

function renderSection() {
  const sec = getSection(currentTab);
  const def = getDef(currentTab);

  document.getElementById('hdr-vessel').textContent = state.vessel.name || '— nessun yacht —';

  if (def.type === 'cover') { el.innerHTML = renderCover(); attachCoverEvents(); return; }
  if (def.type === 'documents') { el.innerHTML = renderDocuments(sec, def); attachDocEvents(sec); return; }
  if (def.type === 'sea_trial') { el.innerHTML = renderSeaTrial(sec, def); attachSeaEvents(sec); return; }
  if (def.type === 'recommendations') { el.innerHTML = renderRecommendations(sec, def); attachRecEvents(sec); return; }
  if (def.type === 'conclusions') { el.innerHTML = renderConclusions(sec, def); attachConclEvents(sec); return; }

  el.innerHTML = renderStandardSection(sec, def);
  attachStandardEvents(sec, def);
}

    });

async function compressImage(file, maxW=1400, q=0.82) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(maxW / img.width, 1);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        res(canvas.toDataURL('image/jpeg', q));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ─── BACKUP / RESTORE ────────────────────────────────────────────────────────
function backupReport() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fname = (state.vessel.name || 'Survey').replace(/[^a-zA-Z0-9_\- ]/g,'_');
  const date = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `${fname}_backup_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup esportato');
}

function restoreReport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const restored = JSON.parse(e.target.result);
      if (!restored.vessel || !restored.sections) throw new Error('File non valido');
      if (!confirm(`Ripristinare il backup "${restored.vessel.name || 'senza nome'}"? I dati attuali verranno sostituiti.`)) return;
      state = restored;
      // Migrate: add missing sections
      SECTIONS.forEach(def => {
        if (!state.sections.find(s=>s.id===def.id)) {
          state.sections.push({
            id:def.id, enabled:true,
            rows:def.rows.map(r=>({label:r,value:''})),
            tests:def.tests.map(t=>({name:t,outcome:''})),
            photos:[], notes:'', outcome:'',
            docs:def.defaultDocs?def.defaultDocs.map(d=>({doc:d,issuedBy:'',issueDate:'',expiry:''})):undefined,
            seaRuns:def.type==='sea_trial'?defaultSeaRuns():undefined,
            recommendText:'', conclusionText:''
          });
        }
      });
      await saveState();
      currentTab = 'cover';
      buildNav(); renderSection();
      showToast('Backup ripristinato');
    } catch(err) {
      showToast('Errore: ' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

async function newReport() {
  if (!confirm('Creare un nuovo report? I dati attuali verranno eliminati.')) return;
  await clearState();
  state = defaultState();
  currentTab = 'cover';
  buildNav();
  renderSection();
  showToast('Nuovo report creato');
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escRaw(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── WORD (.docx) EXPORT ─────────────────────────────────────────────────────
// Genera un vero file .docx (Office Open XML), senza librerie esterne.
// Tutte le tabelle hanno layout FISSO: in Word una foto inserita in una cella
// viene ridotta automaticamente alla larghezza della cella, uguale alle foto
// esportate dall'app.
const DX = {
  COLOR: '1A3A5C',
  PAGE_W: 11906, PAGE_H: 16838,          // A4 in twip
  MARG_L: 1134, MARG_R: 1134, MARG_T: 1134, MARG_B: 1417,
  get CONTENT_W() { return this.PAGE_W - this.MARG_L - this.MARG_R; }, // 9638 twip = 17 cm
  PHOTO_CELL_MAR: 113,                    // 0,2 cm a sinistra e a destra
};
DX.PHOTO_COL_W = Math.floor(DX.CONTENT_W / 2);                  // 4819 twip = 8,5 cm
DX.PHOTO_IMG_EMU = (DX.PHOTO_COL_W - 2 * DX.PHOTO_CELL_MAR) * 635; // larghezza utile cella in EMU

function xe(s) {
  return String(s == null ? '' : s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Run di testo; i ritorni a capo diventano <w:br/>
function dxRun(text, o = {}) {
  const rPr = `<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${o.b?'<w:b/>':''}`
    + `<w:color w:val="${o.color||DX.COLOR}"/><w:sz w:val="${o.sz||18}"/><w:szCs w:val="${o.sz||18}"/></w:rPr>`;
  const parts = String(text == null ? '' : text).split(/\r?\n/);
  return parts.map((t,i) => `<w:r>${rPr}${i?'<w:br/>':''}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`).join('');
}

function dxPara(runs, o = {}) {
  const pPr = `<w:pPr>${o.border?`<w:pBdr><w:top w:val="single" w:sz="4" w:space="2" w:color="BBBBBB"/><w:left w:val="single" w:sz="4" w:space="4" w:color="BBBBBB"/><w:bottom w:val="single" w:sz="4" w:space="2" w:color="BBBBBB"/><w:right w:val="single" w:sz="4" w:space="4" w:color="BBBBBB"/></w:pBdr>`:''}`
    + `<w:spacing w:before="${o.before||0}" w:after="${o.after==null?0:o.after}" w:line="240" w:lineRule="auto"/>`
    + `${o.align?`<w:jc w:val="${o.align}"/>`:''}</w:pPr>`;
  return `<w:p>${pPr}${runs||''}</w:p>`;
}

function dxBorders(b) {
  if (!b) return '';
  const side = s => `<w:${s} w:val="${b.val||'single'}" w:sz="${b.sz||4}" w:space="0" w:color="${b.color||'BBBBBB'}"/>`;
  return `<w:tcBorders>${['top','left','bottom','right'].map(side).join('')}</w:tcBorders>`;
}

// cell: {w, span, paras (xml), fill, borders, align}
function dxCell(c) {
  const tcPr = `<w:tcPr><w:tcW w:w="${c.w}" w:type="dxa"/>${c.span>1?`<w:gridSpan w:val="${c.span}"/>`:''}`
    + dxBorders(c.borders)
    + (c.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${c.fill}"/>`:'')
    + `<w:vAlign w:val="${c.valign||'top'}"/></w:tcPr>`;
  return `<w:tc>${tcPr}${c.paras || dxPara('')}</w:tc>`;
}

// table: widths[] (twip), rows[[cell,...]], cellMar
function dxTable(widths, rows, o = {}) {
  const total = widths.reduce((a,b)=>a+b,0);
  const mar = o.cellMar == null ? 100 : o.cellMar;
  const tblPr = `<w:tblPr><w:tblW w:w="${total}" w:type="dxa"/><w:tblLayout w:type="fixed"/>`
    + `<w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="${mar}" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="${mar}" w:type="dxa"/></w:tblCellMar>`
    + `<w:tblLook w:val="0000"/></w:tblPr>`;
  const grid = `<w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;
  let gi;
  const trs = rows.map(r => {
    gi = 0;
    return `<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map(c => {
      const span = c.span || 1;
      const w = widths.slice(gi, gi + span).reduce((a,b)=>a+b,0);
      gi += span;
      return dxCell({...c, w, span});
    }).join('')}</w:tr>`;
  }).join('');
  return `<w:tbl>${tblPr}${grid}${trs}</w:tbl>` + dxPara('', {after: 160});
}

// ── Immagini ──
// Ridimensiona per il file (qualità buona, peso contenuto) e restituisce byte + dimensioni.
function prepareDocxImage(dataUrl, maxW = 1200) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(maxW / img.width, 1);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * ratio);
      c.height = Math.round(img.height * ratio);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const b64 = c.toDataURL('image/jpeg', 0.85).split(',')[1];
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      res({ bytes, w: c.width, h: c.height });
    };
    img.onerror = () => rej(new Error('Foto non leggibile'));
    img.src = dataUrl;
  });
}

function dxImage(rId, id, wPx, hPx) {
  const cx = DX.PHOTO_IMG_EMU;
  const cy = Math.round(cx * hPx / wPx);
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">`
    + `<wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Foto ${id}"/>`
    + `<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>`
    + `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">`
    + `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">`
    + `<pic:nvPicPr><pic:cNvPr id="${id}" name="foto${id}.jpg"/><pic:cNvPicPr/></pic:nvPicPr>`
    + `<pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`
    + `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom>`
    + `<a:ln w="9525"><a:solidFill><a:srgbClr val="CCCCCC"/></a:solidFill></a:ln></pic:spPr>`
    + `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}

// ── Sezioni ──
function dxSecHeader(def, span) {
  const paras = dxPara(dxRun(def.title, {b:true, sz:20}), {align:'center'})
              + dxPara(dxRun(def.titleEn || '', {sz:16}), {align:'center'});
  return [{ span, paras, fill:'DCE8F5', borders:{val:'double', sz:18, color:DX.COLOR} }];
}
const dxTxt = (t, o) => dxPara(dxRun(t, o));
// Bordi di cella non visibili in stampa: solo le intestazioni di sezione hanno il bordo.
const BORDER_HDR = null;
const BORDER_ROW = null;

function dxPhotos(sec, ctx) {
  const photos = (sec.photos || []).filter(p => p && p.img);
  if (!photos.length) return '';
  const w = DX.PHOTO_COL_W;
  const rows = [];
  for (let i = 0; i < photos.length; i += 2) {
    const row = [];
    for (let j = 0; j < 2; j++) {
      const p = photos[i + j];
      if (p) {
        const rId = `rIdImg${++ctx.imgN}`;
        ctx.images.push({ rId, name: `media/foto${ctx.imgN}.jpg`, bytes: p.img.bytes });
        row.push({ paras: dxPara(dxImage(rId, ctx.imgN, p.img.w, p.img.h), {align:'center'})
                        + dxPara(dxRun(p.caption || '', {sz:16}), {before:80, after:40}) });
      } else {
        // Casella vuota con la stessa struttura delle altre: spazio per la foto + riquadro didascalia
        row.push({ paras: dxPara('', {align:'center'})
                        + dxPara(dxRun('', {sz:16}), {before:80, after:40}) });
      }
    }
    rows.push(row);
  }
  return dxTable([w, w], rows, { cellMar: DX.PHOTO_CELL_MAR });
}

function dxStandard(sec, def, ctx) {
  const W = DX.CONTENT_W, L = Math.round(W * 0.45);
  const rows = [dxSecHeader(def, 2)];
  (sec.rows || []).forEach(r => rows.push([{paras: dxTxt(r.label)}, {paras: dxTxt(r.value)}]));
  if ((sec.tests || []).length) {
    rows.push([{span:2, paras: dxPara(dxRun('TESTS', {b:true, sz:16}), {align:'center'}), borders:BORDER_HDR}]);
    rows.push([{paras: dxPara(dxRun('Type of test', {b:true, sz:16}), {align:'center'}), borders:BORDER_HDR},
               {paras: dxPara(dxRun('Outcome', {b:true, sz:16}), {align:'center'}), borders:BORDER_HDR}]);
    sec.tests.forEach(t => rows.push([{paras: dxTxt(t.name), borders:BORDER_ROW}, {paras: dxTxt(t.outcome), borders:BORDER_ROW}]));
  }
  if (sec.notes) rows.push([{paras: dxTxt('Note')}, {paras: dxTxt(sec.notes)}]);
  rows.push([{paras: dxTxt('Giudizio / Outcome', {b:true})}, {paras: dxTxt(sec.outcome, {b:true})}]);
  return dxTable([L, W - L], rows) + dxPhotos(sec, ctx);
}

function dxDocuments(sec, def) {
  const q = Math.floor(DX.CONTENT_W / 4), widths = [DX.CONTENT_W - 3*q, q, q, q];
  const hdr = t => ({paras: dxPara(dxRun(t, {b:true, sz:16}), {align:'center'}), borders:BORDER_HDR});
  const rows = [dxSecHeader(def, 4),
    [hdr('Documento'), hdr('Rilasciato da / Issued by'), hdr('Data rilascio'), hdr('Scadenza / Expiry')]];
  (sec.docs || []).forEach(d => rows.push([d.doc, d.issuedBy, d.issueDate, d.expiry].map(v => ({paras: dxTxt(v), borders:BORDER_ROW}))));
  if (sec.notes) rows.push([{span:4, paras: dxTxt('Note: ' + sec.notes)}]);
  return dxTable(widths, rows);
}

function dxSeaTrial(sec, def, ctx) {
  const W = DX.CONTENT_W, L = Math.round(W * 0.45), h = Math.floor((W - L) / 2);
  const widths = [L, h, W - L - h];
  const sr = sec.seaRuns || { runs: [] };
  const hdr = (t, span) => ({span, paras: dxPara(dxRun(t, {b:true, sz:16}), {align:'center'}), borders:BORDER_HDR});
  const cell = (t, span) => ({span, paras: dxTxt(t), borders:BORDER_ROW});
  const rows = [dxSecHeader(def, 3)];
  (sr.runs || []).forEach((run, ri) => {
    rows.push([hdr(`Run ${ri+1} — ${run.rpm || ''} rpm`, 3)]);
    rows.push([hdr('Parametro'), hdr('PORT'), hdr('STBD')]);
    (run.params || []).forEach(p => rows.push([cell(p.name), cell(p.portVal), cell(p.stbdVal)]));
  });
  if (sr.topSpeed) rows.push([cell('Top Speed'), cell(sr.topSpeed, 2)]);
  if (sr.manoeuvrNotes) rows.push([cell('Manoeuvrability'), cell(sr.manoeuvrNotes, 2)]);
  if (sec.notes) rows.push([cell('Note'), cell(sec.notes, 2)]);
  return dxTable(widths, rows) + dxPhotos(sec, ctx);
}

function dxRecommendations(sec, def, ctx) {
  return dxTable([DX.CONTENT_W], [dxSecHeader(def, 1), [{paras: dxTxt(sec.recommendText || '')}]]) + dxPhotos(sec, ctx);
}

function dxConclusions(sec, def) {
  const rows = [dxSecHeader(def, 1)];
  if (sec.conclusionText) rows.push([{paras: dxTxt(sec.conclusionText)}]);
  if (sec.notes) { rows.push([{paras: dxTxt('Allegati / Annexes')}]); rows.push([{paras: dxTxt(sec.notes)}]); }
  return dxTable([DX.CONTENT_W], rows);
}

function dxSection(sec, ctx) {
  const def = getDef(sec.id);
  if (!def || def.id === 'cover') return '';
  if (def.type === 'documents') return dxDocuments(sec, def);
  if (def.type === 'sea_trial') return dxSeaTrial(sec, def, ctx);
  if (def.type === 'recommendations') return dxRecommendations(sec, def, ctx);
  if (def.type === 'conclusions') return dxConclusions(sec, def);
  return dxStandard(sec, def, ctx);
}

function buildDocxXml(stateData, ctx) {
  const v = stateData.vessel || {};
  const q = Math.floor(DX.CONTENT_W / 4);
  const lbl = t => ({paras: dxTxt(t, {b:true}), borders:BORDER_HDR});
  const val = t => ({paras: dxTxt(t), borders:BORDER_HDR});
  const cover = dxPara(dxRun('Survey Report', {b:true, sz:26}), {after:80})
    + dxTable([q, q, q, DX.CONTENT_W - 3*q], [
        [lbl('Nome Yacht / Vessel Name'), val(v.name), lbl('Building N°'), val(v.buildingNr)],
        [lbl('Luogo / Location'), val(v.location), lbl('Data / Date'), val(v.date)],
        [lbl("Rappresentante armatore / Owner's rep"), val(v.ownerRep), lbl("Rappresentante cantiere / Yard's rep"), val(v.yardRep)],
      ]);
  const body = stateData.sections
    .filter(sec => sec.enabled && getDef(sec.id))
    .map(sec => dxSection(sec, ctx)).join('');
  const footer = dxPara(dxRun('La Spezia — Piero Ragazzi S.r.l.', {sz:18, color:'666666'}), {before:400});
  const sectPr = `<w:sectPr><w:pgSz w:w="${DX.PAGE_W}" w:h="${DX.PAGE_H}"/>`
    + `<w:pgMar w:top="${DX.MARG_T}" w:right="${DX.MARG_R}" w:bottom="${DX.MARG_B}" w:left="${DX.MARG_L}" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">`
    + `<w:body>${cover}${body}${footer}${sectPr}</w:body></w:document>`;
}

function buildDocxFiles(stateData, ctx) {
  const enc = s => new TextEncoder().encode(s);
  const docXml = buildDocxXml(stateData, ctx);
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults>`
    + `<w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Arial" w:cs="Arial"/><w:color w:val="${DX.COLOR}"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="it-IT"/></w:rPr></w:rPrDefault>`
    + `<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>`
    + `<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>`
    + `<w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style>`
    + `</w:styles>`;
  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
    + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
    + `<Default Extension="xml" ContentType="application/xml"/>`
    + `<Default Extension="jpg" ContentType="image/jpeg"/>`
    + `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>`
    + `<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>`
    + `</Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
    + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
    + `<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`
    + ctx.images.map(im => `<Relationship Id="${im.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${im.name}"/>`).join('')
    + `</Relationships>`;
  return [
    { name: '[Content_Types].xml', data: enc(ct) },
    { name: '_rels/.rels', data: enc(rels) },
    { name: 'word/document.xml', data: enc(docXml) },
    { name: 'word/styles.xml', data: enc(styles) },
    { name: 'word/_rels/document.xml.rels', data: enc(docRels) },
    ...ctx.images.map(im => ({ name: 'word/' + im.name, data: im.bytes })),
  ];
}

// ── ZIP minimale (metodo "store", senza compressione) ──
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), chunks = [], central = [];
  let offset = 0;
  const DOS_TIME = 0, DOS_DATE = (2026 - 1980) << 9 | 1 << 5 | 1;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, DOS_TIME, true); lh.setUint16(12, DOS_DATE, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, DOS_TIME, true); ch.setUint16(14, DOS_DATE, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)],
    { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

async function exportWord() {
  showToast('Preparazione foto…');
  try {
    const wordState = JSON.parse(JSON.stringify(state));
    for (const sec of wordState.sections) {
      if (!sec.enabled || !sec.photos || !sec.photos.length) continue;
      for (const p of sec.photos) {
        try { p.img = await prepareDocxImage(p.dataUrl); } catch (e) { p.img = null; }
        delete p.dataUrl;
      }
    }
    showToast('Generazione documento…');
    const ctx = { images: [], imgN: 0 };
    const blob = makeZip(buildDocxFiles(wordState, ctx));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fname = (state.vessel.name || 'Survey').replace(/[^a-zA-Z0-9_\- ]/g,'_');
    a.href = url; a.download = `${fname}_report.docx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    showToast('File .docx scaricato (v7)');
  } catch(e) {
    console.error(e);
    showToast('Errore: ' + e.message);
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  const saved = await loadState();
  if (saved) {
    state = saved;
    // Migrate: add any missing sections
    SECTIONS.forEach(def => {
      if (!state.sections.find(s=>s.id===def.id)) {
        state.sections.push({
          id:def.id, enabled:true,
          rows:def.rows.map(r=>({label:r,value:''})),
          tests:def.tests.map(t=>({name:t,outcome:''})),
          photos:[], notes:'', outcome:'',
          docs:def.defaultDocs?def.defaultDocs.map(d=>({doc:d,issuedBy:'',issueDate:'',expiry:''})):undefined,
          seaRuns:def.type==='sea_trial'?defaultSeaRuns():undefined,
          recommendText:'', conclusionText:''
        });
      }
    });
  } else {
    state = defaultState();
  }
  buildNav();
  renderSection();
}

// Service Worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

init();
</script>
